<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="./result.html" method="get">
        <fieldset>
            <legend>Applicant Details</legend>
            <label for="name">Name:</label>
        <input type="text" id="name" name="Firstname">
        <br>
        <br>
        <label for="fathername">Father's name: <span style="color: red;">*</span></label>
        <input type="text" id="fathername" name="Father's name">
        <br>
        <br>
        <label for="date">Date:</label>
        <input type="date" name="Date" id="date">
        <br>
        <br>
        <label for="date">Datetime:</label>
        <!-- <input type="datetime" name="Date" id="date"> -->
        <input type="datetime-local" name="Date" id="date">
        <br>
        <br>
        <label for="">Gender:</label>
        <label for="">Male:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="">Female:</label>
        <input type="radio" id="female" name="gender" value="female">
        <br>
        <br>
        <label for="aadhar">Aadhar Number</label>
        <input type="text" id="aadhar" maxlength="12" minlength="12">
        <br>
        <br>
        <label for="number">Whatsapp Number</label>
        <input type="tel" id="number" >
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email">
        <br>
        <br>
        <label for="file">Photo:</label>
        <input type="File" id="file">
        <br>
        <br>
        <input type="submit">
        </fieldset>
    </form>
</body>
</html>
